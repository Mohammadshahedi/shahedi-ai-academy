# کنترل خودکار نسخه استاتیک در Pull Request و Push شاخه اصلی
name: Validate static site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # مخزن با حداقل دسترسی لازم دریافت می‌شود.
      - name: Checkout repository
        uses: actions/checkout@v4

      # نسخه پایدار Node برای اجرای اسکریپت‌های بدون وابستگی پروژه کافی است.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate site structure
        run: node scripts/validate-site.mjs

      # مرزهای پیش‌نمایش فاز ۳A، RBAC و رضایت والدین مستقل کنترل می‌شوند.
      - name: Validate phase 3A safety contracts
        run: node scripts/validate-phase3.mjs

      - name: Check shared JavaScript syntax
        run: node --check dist/assets/site.js

      # خود اعتبارسنج فاز ۳ نیز باید از نظر نحو JavaScript سالم بماند.
      - name: Check phase 3 validator syntax
        run: node --check scripts/validate-phase3.mjs
