# کنترل خودکار سایت Worker و قراردادهای حریم خصوصی در Pull Request و Push شاخه اصلی
name: Validate academy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # مخزن با حداقل دسترسی لازم دریافت می‌شود.
      - name: Checkout repository
        uses: actions/checkout@v4

      # نسخه پایدار Node برای Vinext، TypeScript و validatorها استفاده می‌شود.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # نصب قفل‌شده، از تغییر ناخواسته وابستگی‌ها در CI جلوگیری می‌کند.
      - name: Install dependencies
        run: npm ci

      - name: Validate site structure and phases
        run: npm run check

      # مرزهای پیش‌نمایش فاز ۳A، RBAC و رضایت والدین مستقل کنترل می‌شوند.
      - name: Validate phase 3A safety contracts
        run: node scripts/validate-phase3.mjs

      # build باید Worker و migration موردنیاز Sites را بدون انتشار تولید کند.
      - name: Build Worker
        run: npm run build
